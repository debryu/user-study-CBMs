[project]
name = "user-study-cbms"
version = "0.1.0"
description = "Reproducible codebase for the CBM user study paper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "cqa",
    "clip",
    "pandas",
    "tqdm",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]
cqa = { git = "https://github.com/debryu/CQA.git" }
# CQA vendors its own copy of CLIP but its setup.py doesn't package the bpe vocab
# data file, so it fails to import. Use the upstream package instead.
clip = { git = "https://github.com/openai/CLIP.git" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
